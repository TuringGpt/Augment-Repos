name: Test Server Application

on:
  push:
    branches: [main, augment, develop]
    paths:
      - 'augment-store/server/**'
      - '.github/workflows/test-server.yml'
  pull_request:
    branches: [main, augment, develop]
    paths:
      - 'augment-store/server/**'

jobs:
  test:
    runs-on: ubuntu-latest

    env:  
      DEBUG: 'False'
      SECRET_KEY: 'test-secret-key-for-ci'

      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/test_db'
      DATABASE_NAME: 'test_db'
      DATABASE_USER: 'postgres'
      DATABASE_PASSWORD: 'postgres'
      DATABASE_HOST: 'localhost'
      DATABASE_PORT: '5432'

      REDIS_SERVER_URL: 'redis://localhost:6379/0'

      FILE_UPLOAD_STORAGE: 'local'
      AWS_ACCESS_KEY_ID: 'test-access-key'
      AWS_SECRET_ACCESS_KEY: 'test-secret-key'
      AWS_STORAGE_BUCKET_NAME: 'test-bucket'
      AWS_S3_REGION_NAME: 'us-east-1'
      AWS_S3_CUSTOM_DOMAIN: 'test-domain.s3.amazonaws.com'

      STRIPE_PUBLISHABLE_KEY: "public-key-here"
      STRIPE_SECRET_KEY: "secret-key-here"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'augment-store/server/requirements.txt'

      - name: Install dependencies
        working-directory: augment-store/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo 'Waiting for PostgreSQL...'
            sleep 1
          done

      - name: Wait for Redis
        run: |
          until redis-cli -h localhost -p 6379 ping | grep PONG; do
            echo "Waiting for Redis..."
            sleep 1
          done

      - name: Run migrations
        working-directory: augment-store/server
        run: |
          python manage.py migrate

      - name: Run tests
        working-directory: augment-store/server
        run: |
          python manage.py test --verbosity=2

      - name: Generate coverage report
        working-directory: augment-store/server
        run: |
          pip install coverage
          coverage run --source='.' manage.py test
          coverage report
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./augment-store/server/coverage.xml
          flags: server
          name: server-coverage
          fail_ci_if_error: false
