<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="favOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:oklch(0.705 0.213 47.604);stop-opacity:1" />
      <stop offset="50%" style="stop-color:oklch(0.646 0.222 41.116);stop-opacity:1" />
      <stop offset="100%" style="stop-color:oklch(0.47 0.157 37.304);stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle for contrast -->
  <circle cx="24" cy="24" r="22" fill="oklch(0.98 0.016 73.684)"/>

  <!-- Main Q shape -->
  <circle cx="24" cy="23" r="12" fill="none" stroke="url(#favOrange)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Q tail -->
  <path d="M 32 30 Q 36 34, 38 38" fill="none" stroke="url(#favOrange)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Small accent dot -->
  <circle cx="34" cy="15" r="2" fill="oklch(0.837 0.128 66.29)"/>
</svg>