<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:oklch(0.705 0.213 47.604);stop-opacity:1" />
      <stop offset="50%" style="stop-color:oklch(0.646 0.222 41.116);stop-opacity:1" />
      <stop offset="100%" style="stop-color:oklch(0.47 0.157 37.304);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:oklch(0.837 0.128 66.29);stop-opacity:1" />
      <stop offset="100%" style="stop-color:oklch(0.705 0.213 47.604);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Q shape -->
  <circle cx="60" cy="55" r="35" fill="none" stroke="url(#orangeGradient)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Q tail with curved design -->
  <path d="M 80 75 Q 90 85, 95 95" fill="none" stroke="url(#orangeGradient)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Inner accent circle for depth -->
  <circle cx="60" cy="55" r="20" fill="none" stroke="url(#accentGradient)" stroke-width="3" opacity="0.5"/>
  
  <!-- Small dot accent in top right -->
  <circle cx="85" cy="30" r="4" fill="url(#accentGradient)"/>
</svg>
